:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#17253a;background:#f2f5f9}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{max-width:780px;margin:auto;padding:0 16px 96px}header{background:#10213a;color:white;padding:24px 18px 22px;margin:0 -16px 18px;border-radius:0 0 22px 22px}header small{color:#a9c5e6}h1{margin:3px 0;font-size:30px}h2{font-size:21px;margin:10px 0 14px}h3{font-size:17px;margin:0 0 8px}.sub{color:#617089;font-size:13px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:0 0 18px}.tabs button{border:0;background:#e2e8f0;padding:11px 3px;border-radius:12px;color:#43546a;font-weight:650;font-size:12px}.tabs .active{background:#143e73;color:white}.card{background:white;border:1px solid #e2e8f0;border-radius:17px;padding:16px;margin:0 0 12px;box-shadow:0 3px 12px #10213a08}.vehicle{border-left:5px solid #2271b9}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.pill{font-size:12px;border-radius:99px;padding:5px 9px;background:#e7f0fa;color:#20558b;white-space:nowrap}.muted{color:#68778b;font-size:13px}.btn{border:0;background:#1b65aa;color:white;padding:12px 15px;border-radius:11px;font-weight:700}.btn.alt{background:#e7eef6;color:#19436c}.btn.danger{background:#fce9e8;color:#9e2626}.btn.small{font-size:13px;padding:8px 10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}label{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}input,select,textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;background:white;color:#17253a}textarea{min-height:90px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hide{display:none!important}.empty{text-align:center;color:#617089;padding:30px 10px}.section{font-weight:800;margin:22px 0 10px}.spec{padding:11px 0;border-top:1px solid #e8edf3}.spec b{font-size:14px}.spec p{margin:4px 0;font-size:13px;color:#52637a;lin
